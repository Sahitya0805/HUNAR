<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Luxury Radial Gradient for Forest Green Shield -->
    <radialGradient id="hunarBgGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#144F3B"/>
      <stop offset="60%" stop-color="#0F382A"/>
      <stop offset="100%" stop-color="#072017"/>
    </radialGradient>

    <!-- Warm Gold Metallic Gradient -->
    <linearGradient id="hunarGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#hunarBgGrad)" stroke="#C59B27" stroke-width="2" stroke-opacity="0.4" filter="url(#softShadow)"/>

  <!-- Rotating Orbit Style Group (Dashed Golden Chakra Orbit) -->
  <g id="revolving-orbit">
    <!-- Outer Delicate Orbit Ring -->
    <circle cx="60" cy="60" r="44" stroke="url(#hunarGoldGrad)" stroke-width="1.8" stroke-dasharray="5 7" fill="none" opacity="0.85"/>
    <!-- Cardinal Orbital Nodes (Representing 4 Livelihood Quadrants) -->
    <circle cx="60" cy="16" r="3.5" fill="#FDE68A" stroke="#996515" stroke-width="0.8"/>
    <circle cx="104" cy="60" r="3.5" fill="#FDE68A" stroke="#996515" stroke-width="0.8"/>
    <circle cx="60" cy="104" r="3.5" fill="#FDE68A" stroke="#996515" stroke-width="0.8"/>
    <circle cx="16" cy="60" r="3.5" fill="#FDE68A" stroke="#996515" stroke-width="0.8"/>
  </g>

  <!-- Inner Subtle Concentric Guide Ring -->
  <circle cx="60" cy="60" r="32" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" fill="none"/>

  <!-- Central Agricultural Sprout & Livelihood Leaf Motif -->
  <g id="central-sprout" transform="translate(60, 60)">
    <!-- Central Rising Stem of Growth -->
    <path d="M0,24 V-4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Primary Golden Grain / Leaf (Right) -->
    <path d="M0,-4 C0,-14 9,-19 16,-19 C16,-9 10,0 0,-4 Z" fill="url(#hunarGoldGrad)" stroke="#FFFFFF" stroke-width="1.2"/>
    
    <!-- Secondary Emerald Sprout Leaf (Left) -->
    <path d="M0,6 C0,-2 -8,-6 -14,-6 C-14,2 -8,10 0,6 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
    
    <!-- Small Dawn Seedling Tip (Top) -->
    <circle cx="0" cy="-14" r="2.5" fill="#FEF08A"/>
  </g>
</svg>
