<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <style>
      @keyframes soberSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .orbit-ring {
        animation: soberSpin 24s linear infinite;
        transform-origin: 20px 20px;
      }
    </style>
  </defs>

  <!-- Background Forest Green Rounded Badge -->
  <rect x="0" y="0" width="40" height="40" rx="12" fill="#0A281C" stroke="#144F3B" stroke-width="1.5"/>

  <!-- Subtle Sober Revolving Orbit Ring -->
  <g class="orbit-ring">
    <circle cx="20" cy="20" r="15" stroke="#C59B27" stroke-width="1" stroke-dasharray="3 4" fill="none" opacity="0.85"/>
    <circle cx="20" cy="5" r="1.5" fill="#FDE68A"/>
    <circle cx="20" cy="35" r="1.5" fill="#FDE68A"/>
  </g>

  <!-- Sober Agricultural Sprout & Leaf Center Motif -->
  <g transform="translate(10, 10)">
    <!-- Central Stem -->
    <path d="M10,18 V8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Golden Leaf (Right) -->
    <path d="M10,8 C10,4.2 13.5,2 16,2 C16,5.2 13.8,8.5 10,8 Z" fill="#FDE68A" stroke="#FFFFFF" stroke-width="1"/>
    <!-- Emerald Leaf (Left) -->
    <path d="M10,12 C10,8.8 7,7 5,7 C5,9.8 6.8,12.5 10,12 Z" fill="#10B981" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>
